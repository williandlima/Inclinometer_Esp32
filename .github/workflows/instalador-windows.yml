# Gera, numa máquina Windows do GitHub, o executável do app Python
# (PyInstaller) e o instalador Setup.exe (Inno Setup), com ícone na Área de
# Trabalho e no Menu Iniciar. Assim ninguém precisa montar o build à mão nem
# abrir o VSCode para usar o software.
#
# Onde baixar: aba Actions do GitHub → "Instalador Windows" → execução mais
# recente → seção Artifacts → "Inclinometro-2Eixos-Setup". Para gerar sob
# demanda, use o botão "Run workflow" da mesma página.
name: Instalador Windows

on:
  push:
    paths:
      - "python-app/**"
      - ".github/workflows/instalador-windows.yml"
  workflow_dispatch:

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências do app e do PyInstaller
        run: pip install -r python-app/requirements.txt -r python-app/windows/requirements-build.txt

      - name: Executável (PyInstaller)
        working-directory: python-app
        run: pyinstaller --noconfirm windows/Inclinometro.spec

      - name: Confere que o executável abre e importa tudo
        shell: pwsh
        working-directory: python-app
        run: |
          $exe = "dist\Inclinometro2Eixos\Inclinometro2Eixos.exe"
          if (-not (Test-Path $exe)) { throw "Executável não gerado" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "O executável fechou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: o executável continuou aberto por 20 s"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc python-app\windows\Inclinometro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Publica o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Inclinometro-2Eixos-Setup
          path: python-app/windows/installer_output/*.exe
          retention-days: 90

      - name: Prepara a versão portátil
        shell: pwsh
        run: |
          Copy-Item python-app\windows\instalar_inclinometro.bat "python-app\dist\Inclinometro2Eixos\INSTALAR - criar icone na Area de Trabalho.bat"

      - name: Simula uma versão antiga instalada pelo Setup (ícone na Área de Trabalho pública)
        shell: pwsh
        run: |
          $setup = Get-ChildItem python-app\windows\installer_output\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait
          $pub = Get-ChildItem ([Environment]::GetFolderPath('CommonDesktopDirectory')) -Filter 'Inclinometro*.lnk'
          if (-not $pub) { throw "O Setup não criou o ícone na Área de Trabalho pública" }
          Write-Host "OK: ícone do Setup em $($pub.FullName)"

      - name: Testa o instalar_inclinometro.bat (cópia, desbloqueio e atalhos)
        shell: pwsh
        run: |
          $bat = "python-app\dist\Inclinometro2Eixos\INSTALAR - criar icone na Area de Trabalho.bat"
          $out = cmd /c "`"$bat`" < NUL" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Versao instalada: \d+\.\d+\.\d+') { throw "O .bat não mostrou a versão instalada" }
          $velho = Get-ChildItem ([Environment]::GetFolderPath('CommonDesktopDirectory')) -Filter 'Inclinometro*.lnk' -ErrorAction SilentlyContinue
          if ($velho) { throw "Ícone da versão antiga (Setup) não foi removido: $($velho.FullName)" }
          Write-Host "OK: ícone da versão antiga removido"
          $dest = Join-Path $env:LOCALAPPDATA "Programs\Inclinometro2Eixos\Inclinometro2Eixos.exe"
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Inclinometro 2 Eixos (Avibras Aeroco).lnk"
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) "Inclinometro 2 Eixos (Avibras Aeroco).lnk"
          foreach ($f in @($dest, $lnk, $menu)) { if (-not (Test-Path $f)) { throw "Não criado: $f" } else { Write-Host "OK: $f" } }
          $alvo = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($alvo -ne $dest) { throw "Atalho aponta para $alvo" }
          Start-Sleep -Seconds 10
          $p = Get-Process Inclinometro2Eixos -ErrorAction SilentlyContinue
          if (-not $p) { throw "O programa não ficou aberto depois da instalação" }
          Write-Host "OK: programa aberto pelo .bat"
          $p | Stop-Process -Force

      - name: Testa o .bat rodado de dentro do código-fonte (ícone abre o código, não um .exe)
        shell: pwsh
        run: |
          $out = cmd /c "`"python-app\windows\instalar_inclinometro.bat`" < NUL" 2>&1 | Out-String
          Write-Host $out
          $ver = (Select-String -Path python-app\app_version.py -Pattern 'APP_VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ($out -notmatch [regex]::Escape("Versao do app: $ver")) { throw "O .bat não mostrou a versão $ver do código" }
          $w = New-Object -ComObject WScript.Shell
          foreach ($d in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $s = $w.CreateShortcut((Join-Path $d "Inclinometro 2 Eixos (Avibras Aeroco).lnk"))
            if ($s.TargetPath -notlike '*\pythonw.exe' -or $s.Arguments -notlike '*main.py*') { throw "Atalho em $d aponta para $($s.TargetPath) $($s.Arguments)" }
            Write-Host "OK: $d -> $($s.TargetPath) $($s.Arguments)"
          }
          $dirs = @('Desktop','Programs','CommonDesktopDirectory','CommonPrograms') | ForEach-Object { [Environment]::GetFolderPath($_) }
          $exeLinks = $dirs | Where-Object { $_ -and (Test-Path $_) } | ForEach-Object { Get-ChildItem $_ -Filter 'Inclinometro*.lnk' -Recurse -Depth 1 } |
            Where-Object { $w.CreateShortcut($_.FullName).TargetPath -like '*\Inclinometro2Eixos.exe' }
          if ($exeLinks) { throw "Sobrou atalho abrindo o .exe antigo: $($exeLinks.FullName -join ', ')" }
          Write-Host "OK: nenhum atalho abrindo o .exe antigo"
          Start-Sleep -Seconds 15
          $app = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'pythonw.exe' -and $_.CommandLine -like '*main.py*' }
          if (-not $app) { throw "O app não ficou aberto pelo código-fonte" }
          Write-Host "OK: app aberto pelo código-fonte"
          $app | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

      - name: Publica a versão portátil (pasta com o .exe, sem instalar)
        uses: actions/upload-artifact@v4
        with:
          name: Inclinometro-2Eixos-Portatil
          path: python-app/dist/Inclinometro2Eixos/
          retention-days: 90
