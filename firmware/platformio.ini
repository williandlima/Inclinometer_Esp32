; Projeto PlatformIO do firmware do Inclinômetro ESP32.
; Ver README.md para instruções de build/flash e para a pinagem/orientação
; do sensor a confirmar junto ao projeto elétrico.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
